# UA production (HostPro): Postgres + Redis + migrate + API in Docker.
# TLS is the existing HostPro nginx (not this file). Shop/Next stays on Vercel.
#
# Start: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Startup: postgres (healthy) → migrate (`prisma migrate deploy`, one-shot)
#          → api (`node dist/main.js`). Failed migrate → api does not start.
#
# nginx: proxy https://api.<domain> → http://127.0.0.1:3001
# Do not publish 80/443 from Docker (PrestaShop/nginx already own them).
# SK/Hetzner Coolify: use docker-compose.coolify.yml instead.

services:
  postgres:
    image: postgres:16-alpine
    container_name: green-angels-postgres
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: green-angels-redis
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # AOF lives under /data (redis_data volume). everysec = at most ~1s loss on crash.
    # Do not skip the entrypoint: Redis 7 with --appendonly yes on an RDB-only volume
    # loads empty AOF and discards dump.rdb. The entrypoint converts live first.
    volumes:
      - redis_data:/data
      - ./docker/redis-aof-entrypoint.sh:/redis-aof-entrypoint.sh:ro
    entrypoint: ['/bin/sh', '/redis-aof-entrypoint.sh']
    command:
      [
        'redis-server',
        '--requirepass', '${REDIS_PASSWORD}',
        '--appendonly', 'yes',
        '--appendfsync', 'everysec',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: green-angels-migrate
    restart: 'no'
    command: ['npx', '--no-install', 'prisma', 'migrate', 'deploy']
    env_file:
      - path: .env.prod
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: green-angels-api
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    env_file:
      - path: .env.prod
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://green-angels.example.com}
      MEDIA_DRIVER: ${MEDIA_DRIVER:-r2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
